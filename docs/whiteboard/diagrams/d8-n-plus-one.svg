<svg xmlns="http://www.w3.org/2000/svg" xmlns:gn="http://www.goodnotes.com/gn-svg" width="1240" height="900" viewBox="0 0 1240 900">

  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111">N+1 vs DataLoader — the same page, the same data, ~1,200 position rows</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666666">A resolver runs per field, PER OBJECT — not per query. That single fact is the whole problem.</text>

  <!-- LEFT: naive -->
  <rect x="30" y="80" width="570" height="640" fill="#fdeaea" stroke="#a8341f" stroke-width="2" rx="8"/>
  <text x="50" y="108" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#7a2314">NAIVE — one query per resolver call</text>

  <rect x="50" y="124" width="530" height="86" fill="#ffffff" stroke="#c07060" stroke-width="1" rx="4"/>
  <text x="62" y="144" font-family="Courier, monospace" font-size="12" fill="#111111">race(slug) {</text>
  <text x="62" y="161" font-family="Courier, monospace" font-size="12" fill="#111111">  positions {            # 1 query, ~1200 rows</text>
  <text x="62" y="178" font-family="Courier, monospace" font-size="12" fill="#111111">    driver { name        # resolver fires 1200 times</text>
  <text x="62" y="195" font-family="Courier, monospace" font-size="12" fill="#111111">      team { name color } } } }</text>

  <!-- ladder of calls -->
  <rect x="50" y="226" width="530" height="30" fill="#ffffff" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="246" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT race           WHERE slug = ...                     1</text>

  <rect x="50" y="262" width="530" height="30" fill="#ffffff" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="282" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT race_positions WHERE race_id = ...                  1</text>

  <rect x="50" y="298" width="530" height="30" fill="#ffe0e0" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="318" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT assignment     WHERE id = ...   x1200           1,200</text>

  <rect x="50" y="334" width="530" height="30" fill="#ffe0e0" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="354" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT driver         WHERE id = ...   x1200           1,200</text>

  <rect x="50" y="370" width="530" height="30" fill="#ffe0e0" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="390" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT team_season    WHERE id = ...   x1200           1,200</text>

  <rect x="50" y="406" width="530" height="30" fill="#ffe0e0" stroke="#c07060" stroke-width="1" rx="3"/>
  <text x="62" y="426" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT team           WHERE id = ...   x1200           1,200</text>

  <rect x="50" y="446" width="530" height="46" fill="#a8341f" stroke="#7a2314" stroke-width="2" rx="4"/>
  <text x="62" y="476" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">~4,800 queries to render one page</text>

  <text x="50" y="522" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a2314">The waste, precisely</text>
  <text x="50" y="544" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">There are TWENTY drivers in the race. The same twenty rows</text>
  <text x="50" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">are fetched SIXTY TIMES EACH — once per lap.</text>
  <text x="50" y="584" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">1. Duplication — the same driver, over and over.</text>
  <text x="50" y="602" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">2. Fragmentation — twenty round trips instead of one IN (...).</text>

  <text x="50" y="634" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a2314">Why this survives review</text>
  <text x="50" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">It is CORRECT. Every query returns the right answer.</text>
  <text x="50" y="674" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">In dev — 3 drivers, 5 laps, local Postgres — it is 60 queries</text>
  <text x="50" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">and a few milliseconds. The failure appears in front of a user,</text>
  <text x="50" y="710" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">against Neon, over a network — never in front of you.</text>

  <!-- RIGHT: dataloader -->
  <rect x="640" y="80" width="570" height="640" fill="#e9f6ee" stroke="#2f7a4a" stroke-width="2" rx="8"/>
  <text x="660" y="108" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1c5230">WITH DATALOADER — batch + identity map</text>

  <rect x="660" y="124" width="530" height="104" fill="#ffffff" stroke="#5a9a70" stroke-width="1" rx="4"/>
  <text x="672" y="144" font-family="Courier, monospace" font-size="12" fill="#111111">driverById = new DataLoader(async (ids) =&gt; {</text>
  <text x="672" y="161" font-family="Courier, monospace" font-size="12" fill="#111111">  const rows = await db.select().from(drivers)</text>
  <text x="672" y="178" font-family="Courier, monospace" font-size="12" fill="#111111">    .where(inArray(drivers.id, [...ids]));</text>
  <text x="672" y="195" font-family="Courier, monospace" font-size="12" fill="#111111">  const byId = new Map(rows.map(r =&gt; [r.id, r]));</text>
  <text x="672" y="212" font-family="Courier, monospace" font-size="12" fill="#a8341f">  return ids.map(id =&gt; byId.get(id));  // ORDER MATTERS</text>

  <rect x="660" y="240" width="530" height="30" fill="#ffffff" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="260" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT race           WHERE slug = ...                     1</text>

  <rect x="660" y="276" width="530" height="30" fill="#ffffff" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="296" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT race_positions WHERE race_id = ...                  1</text>

  <rect x="660" y="312" width="530" height="30" fill="#d8f0e0" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="332" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT assignment  WHERE id IN (20 ids)                    1</text>

  <rect x="660" y="348" width="530" height="30" fill="#d8f0e0" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="368" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT driver      WHERE id IN (20 ids)                    1</text>

  <rect x="660" y="384" width="530" height="30" fill="#d8f0e0" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="404" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT team_season WHERE id IN (10 ids)                    1</text>

  <rect x="660" y="420" width="530" height="30" fill="#d8f0e0" stroke="#5a9a70" stroke-width="1" rx="3"/>
  <text x="672" y="440" font-family="Courier, monospace" font-size="12" fill="#111111">SELECT team        WHERE id IN (10 ids)                    1</text>

  <rect x="660" y="460" width="530" height="46" fill="#2f7a4a" stroke="#1c5230" stroke-width="2" rx="4"/>
  <text x="672" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">~6 queries to render the same page</text>

  <text x="660" y="536" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c5230">Two mechanisms, two separable ideas</text>
  <text x="660" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">BATCHING — collect every .load(id) in one tick of the event</text>
  <text x="660" y="574" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">loop, then issue ONE query for all of them.</text>
  <text x="660" y="596" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">IDENTITY MAP — within one loader, a key is fetched at most</text>
  <text x="660" y="612" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">once. Sixty requests for one driver collapse to one.</text>

  <text x="660" y="644" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c5230">Bounded by ENTITY TYPES, not by row count</text>
  <text x="660" y="666" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">A 78-lap Monaco race issues the same six queries as a</text>
  <text x="660" y="682" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">44-lap sprint. That is the property to check for — a count</text>
  <text x="660" y="698" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">that does not grow with the data.</text>

  <!-- bottom notes -->
  <rect x="30" y="742" width="570" height="130" fill="#fffbe6" stroke="#ccaa00" stroke-width="1" rx="6"/>
  <text x="48" y="766" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Per request, never global</text>
  <text x="48" y="788" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">createContext() builds a fresh set of loaders for every request,</text>
  <text x="48" y="804" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">and every execute() call.</text>
  <text x="48" y="826" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">A module-level loader would cache rows for the life of the</text>
  <text x="48" y="842" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">process: a cache with no invalidation and no bound. The cache</text>
  <text x="48" y="858" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">is correct BECAUSE it is short-lived, not because anything clears it.</text>

  <rect x="640" y="742" width="570" height="130" fill="#fffbe6" stroke="#ccaa00" stroke-width="1" rx="6"/>
  <text x="658" y="766" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Verification 3 — look, do not assume</text>
  <text x="658" y="788" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Watch the Neon query log while loading ONE race. The count</text>
  <text x="658" y="804" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">must be bounded, not proportional to driver count.</text>
  <text x="658" y="826" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">A missing loader produces NO error and NO visible symptom.</text>
  <text x="658" y="842" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Counting queries is the only way to know it is wired — which is</text>
  <text x="658" y="858" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">why M1.5's criterion says "verified in the log, not assumed".</text>

  <!-- arrow between panels -->
  <line x1="602" y1="470" x2="636" y2="470" stroke="#222222" stroke-width="4"/>
  <line x1="636" y1="470" x2="622" y2="462" stroke="#222222" stroke-width="4"/>
  <line x1="636" y1="470" x2="622" y2="478" stroke="#222222" stroke-width="4"/>
</svg>