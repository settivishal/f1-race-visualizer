# Both championship tables and the season list in one document, because they are
# one page and one cache entry. Splitting them would mean two round trips for a
# view nobody wants half of.
query SeasonStandings($season: Int!) {
  driverStandings(season: $season) {
    position
    points
    wins
    podiums
    driver {
      code
      name
      number
    }
    team {
      name
      color
    }
    # One per team raced for: two for a driver moved mid-season.
    stints {
      team {
        name
        color
      }
      points
      wins
      fromRound
      toRound
    }
  }
  constructorStandings(season: $season) {
    position
    points
    wins
    team {
      name
      color
    }
  }
  seasons {
    year
  }
}
