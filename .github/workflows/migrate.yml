name: Migrate

# Migrations are applied from one runner, from reviewed code that is already on
# a protected branch — never from a developer's machine, where DATABASE_URL is
# whatever .env happens to hold.
on:
  push:
    branches: [main, dev]
    paths:
      - 'src/db/migrations/**'
  # Runnable by hand, so the runner and its secrets can be proven against dev
  # before a real migration depends on them. Applying migrations is idempotent:
  # drizzle-kit skips what the journal says is already applied.
  workflow_dispatch:

# Two pushes in quick succession must not apply migrations concurrently.
concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One step per target rather than one step picking a target. An earlier
      # version selected the URL with `ref == 'main' && A || B`, which silently
      # falls through to B whenever A is empty — so a misconfigured production
      # secret would have migrated the dev database from a push to main.
      - name: Apply migrations to production
        if: github.ref_name == 'main'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is empty"; exit 1; }
          pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply migrations to the dev branch database
        if: github.ref_name != 'main'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL_DEV secret is empty"; exit 1; }
          pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
