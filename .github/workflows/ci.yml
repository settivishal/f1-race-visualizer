name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The v1 failure, detected automatically: schema.ts and the committed
      # migrations must agree. A diff here means the source of truth drifted.
      - run: pnpm db:generate
      - run: git diff --exit-code src/db/migrations
