type CareerTotals {
  bestFinish: Int
  podiums: Int!
  points: Float!
  seasonCount: Int!
  seasons: [SeasonRecord!]!
  starts: Int!
  wins: Int!
}

type Circuit {
  country: String
  ergastId: String!
  firstGrandPrix: Int
  id: ID!
  latitude: Float
  lengthKm: Float
  locality: String
  longitude: Float
  name: String!
  turns: Int
}

type ConstructorStanding {
  points: Float!
  position: Int!
  team: Team!
  wins: Int!
}

enum DataTier {
  FULL
  LAPS
}

scalar DateTime

type Driver {
  code: String!
  country: String
  id: ID!
  name: String!
  number: Int
}

type DriverLapTimes {
  driver: Driver
  laps: [Lap!]!
  pace: Pace!
  team: Team
}

type DriverProfile {
  career: CareerTotals!
  driver: Driver!
}

type DriverStanding {
  driver: Driver!
  podiums: Int!
  points: Float!
  position: Int!
  team: Team!
  wins: Int!
}

enum DriverStatus {
  DNF
  DNS
  DSQ
  FINISHED
}

type HeadToHead {
  a: HeadToHeadSide!
  b: HeadToHeadSide!
  laps: [HeadToHeadLap!]!
  lapsAheadA: Int!
  lapsAheadB: Int!
}

type HeadToHeadLap {
  lap: Int!
  positionDelta: Int
  timeDelta: Float
}

type HeadToHeadSide {
  driver: Driver
  finalPosition: Int
  pace: Pace!
  team: Team
}

type IngestRun {
  error: String
  finishedAt: DateTime
  id: ID!
  rowsWritten: Int!
  source: String!
  startedAt: DateTime!
  status: IngestRunStatus!
  target: String
}

enum IngestRunStatus {
  FAILED
  RUNNING
  SUCCESS
}

type Lap {
  isOutlier: Boolean!
  lap: Int!
  time: Float!
}

type Meeting {
  adminEdited: [String!]!
  circuit: Circuit
  circuitName: String
  country: String!
  id: ID!
  name: String!
  races: [Race!]!
  round: Int!
  season: Int!
  startDate: DateTime!
}

type Mutation {
  setRaceFeatured(featured: Boolean!, slug: String!): Race!
  triggerIngest(sessionKey: Int!): TriggerIngestResult!
  updateRaceMetadata(circuitName: String, country: String, laps: Int, name: String, release: [String!], slug: String!, status: String): Race!
}

type Pace {
  best: Float
  consistency: Float
  lapsCounted: Int!
  lapsExcluded: Int!
  mean: Float
  median: Float
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type PitStop {
  driver: Driver
  durationSeconds: Float
  lap: Int!
  team: Team
  underStoppage: Boolean!
}

type PodiumSlot {
  code: String!
  position: Int!
  teamColor: String
}

type PulseRound {
  name: String!
  round: Int!
  slug: String
  status: PulseRoundStatus!
  teamColor: String
  teamName: String
  winnerCode: String
}

enum PulseRoundStatus {
  CANCELLED
  COMPLETED
  SCHEDULED
}

type Query {
  activeSeason: Int!
  circuit(ergastId: String!): Circuit
  circuits: [Circuit!]!
  constructorStandings(season: Int!): [ConstructorStanding!]!
  driver(code: String!): DriverProfile
  driverStandings(season: Int!): [DriverStanding!]!
  drivers(season: Int): [Driver!]!
  featuredRace: Race
  ingestRuns(first: Int = 50): [IngestRun!]!
  latestRace: Race
  nextRace: Race
  race(slug: String!): Race
  raceSlugs: [RaceSlug!]!
  races(after: String, before: String, first: Int, search: String, season: Int, type: RaceType): RaceConnection!
  search(query: String!): [SearchHit!]!
  seasonPulse(season: Int!): [PulseRound!]!
  seasons: [Season!]!
  team(name: String!): TeamProfile
  teams(season: Int): [Team!]!
}

type Race {
  adminEdited: [String!]!
  analysis: RaceAnalysis!
  dataTier: DataTier!
  date: DateTime!
  events(lap: Int): [RaceEvent!]!
  id: ID!
  isFeatured: Boolean!
  laps: Int!
  meeting: Meeting
  openf1SessionKey: Int
  podium: [PodiumSlot!]!
  replay: RaceReplay!
  results: [RaceResult!]!
  slug: String!
  status: RaceStatus!
  type: RaceType!
  weekendSprint: Race
}

type RaceAnalysis {
  headToHead(driverA: String!, driverB: String!): HeadToHead
  lapTimes: [DriverLapTimes!]!
  pitStops: [PitStop!]!
  stints: [Stint!]!
}

type RaceConnection {
  edges: [RaceEdge!]!
  pageInfo: PageInfo!
}

type RaceEdge {
  cursor: String!
  node: Race!
}

type RaceEvent {
  details: String!
  driver: Driver
  lap: Int!
  type: String!
}

type RacePosition {
  driver: Driver
  lap: Int!
  lapTime: Float
  position: Int!
  sector1: Float
  sector2: Float
  sector3: Float
  team: Team
}

type RaceReplay {
  drivers: [ReplayDriver!]!
  events: [RaceEvent!]!
  laps: [Int!]!
  summary: ReplaySummary!
}

type RaceResult {
  driver: Driver
  fastestLap: Boolean!
  finalPosition: Int
  gridPosition: Int
  lapsCompleted: Int!
  points: Float!
  status: DriverStatus!
  team: Team
}

type RaceSlug {
  date: DateTime!
  slug: String!
}

enum RaceStatus {
  CANCELLED
  COMPLETED
  SCHEDULED
}

enum RaceType {
  GRAND_PRIX
  SPRINT
}

type ReplayDriver {
  driver: Driver
  positions: [RacePosition!]!
  team: Team
}

type ReplaySummary {
  driverCount: Int!
  lapCount: Int!
  maxLap: Int!
  maxPosition: Int!
}

type SearchHit {
  href: String!
  kind: SearchKind!
  subtitle: String
  title: String!
}

enum SearchKind {
  CIRCUIT
  DRIVER
  RACE
  TEAM
}

type Season {
  year: Int!
}

type SeasonRecord {
  bestFinish: Int
  podiums: Int!
  points: Float!
  season: Int!
  starts: Int!
  team: Team
  wins: Int!
}

type Stint {
  compound: String
  driver: Driver
  lapEnd: Int!
  lapStart: Int!
  stintNumber: Int!
  team: Team
}

type Team {
  color: String
  id: ID!
  name: String!
}

type TeamProfile {
  career: CareerTotals!
  drivers(season: Int): [Driver!]!
  team: Team!
}

type TriggerIngestResult {
  rowsWritten: Int!
  slug: String!
  warnings: [String!]!
}
