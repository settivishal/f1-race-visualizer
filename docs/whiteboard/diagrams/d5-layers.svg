<svg xmlns="http://www.w3.org/2000/svg" xmlns:gn="http://www.goodnotes.com/gn-svg" width="1200" height="880" viewBox="0 0 1200 880">

  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111">F1 v2 — Layers and Dependency Direction</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666666">Every arrow points DOWN. Nothing below ever imports from above. That single rule is what layering means.</text>

  <!-- Layer 5 -->
  <rect x="60" y="90" width="800" height="86" fill="#f4e9f7" stroke="#7a4a8c" stroke-width="2" rx="6"/>
  <text x="76" y="114" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5a2a6c">5 · PRESENTATION</text>
  <text x="76" y="136" font-family="Courier, monospace" font-size="12" fill="#111111">app/(public)/*   app/admin/*   components/race-visualization/*   components/ui/*</text>
  <text x="76" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a2a6c">Server components call execute(). Client components use urql hooks. Neither has ever heard of Drizzle.</text>
  <text x="76" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a2a6c">The replay player receives RaceReplayFragment as a prop — it declares its own needs (ISP).</text>

  <!-- Layer 4 -->
  <rect x="60" y="206" width="800" height="86" fill="#e9eff9" stroke="#3a5a8c" stroke-width="2" rx="6"/>
  <text x="76" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#22406a">4 · TRANSPORT</text>
  <text x="76" y="252" font-family="Courier, monospace" font-size="12" fill="#111111">graphql/execute.ts  (in-process)          app/api/graphql/  (Yoga, HTTP)</text>
  <text x="76" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#22406a">FACADE. Two doors, one room. Swapping the transport would not touch layer 5.</text>
  <text x="76" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#22406a">Depth + cost limits and dev-only introspection live at the HTTP door.</text>

  <!-- Layer 3 -->
  <rect x="60" y="322" width="800" height="100" fill="#e9f6ee" stroke="#2f7a4a" stroke-width="2" rx="6"/>
  <text x="76" y="346" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1c5230">3 · API / SCHEMA</text>
  <text x="76" y="368" font-family="Courier, monospace" font-size="12" fill="#111111">graphql/builder.ts   graphql/schema/*.ts   graphql/loaders.ts</text>
  <text x="76" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#1c5230">Resolvers depend on the CONTEXT INTERFACE — { db, loaders, session } — not on a Neon client.</text>
  <text x="76" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#1c5230">That is why the same resolvers run against PGlite in tests with nothing mocked. DIP, concretely.</text>
  <text x="76" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#1c5230">Authorization is per-field, because one URL serves both public and admin operations.</text>

  <!-- Layer 2 -->
  <rect x="60" y="452" width="800" height="100" fill="#fdf3e3" stroke="#8c6a3a" stroke-width="2" rx="6"/>
  <text x="76" y="476" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6a4a1a">2 · DOMAIN / INGEST</text>
  <text x="76" y="498" font-family="Courier, monospace" font-size="12" fill="#111111">lib/ingest/transform.ts   PURE — the functional core</text>
  <text x="76" y="516" font-family="Courier, monospace" font-size="12" fill="#111111">lib/ingest/run.ts  ·  openf1.ts  ·  images.ts   the imperative shell</text>
  <text x="76" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#6a4a1a">transform.ts imports NOTHING from any layer. It is data in, data out — which is why it is the most tested file.</text>
  <text x="76" y="550" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#6a4a1a">Ingest writes to layer 1 DIRECTLY. It deliberately skips layers 3 and 4 — a batch write is not a client read.</text>

  <!-- Layer 1 -->
  <rect x="60" y="582" width="800" height="86" fill="#eeeeee" stroke="#555555" stroke-width="2" rx="6"/>
  <text x="76" y="606" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333333">1 · PERSISTENCE</text>
  <text x="76" y="628" font-family="Courier, monospace" font-size="12" fill="#111111">db/schema.ts  (hand-written, source of truth)   db/index.ts  (neon-serverless Pool)   db/migrations/</text>
  <text x="76" y="648" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#333333">No Repository layer over Drizzle. Drizzle IS the repository — wrapping it would be an interface with one</text>
  <text x="76" y="664" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#333333">implementation, and would hide the constraints that carry most of this system's correctness.</text>

  <!-- Layer 0 -->
  <rect x="60" y="698" width="800" height="62" fill="#fdeaea" stroke="#a8341f" stroke-width="2" rx="6"/>
  <text x="76" y="722" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7a2314">0 · EXTERNAL</text>
  <text x="76" y="744" font-family="Courier, monospace" font-size="12" fill="#111111">api.openf1.org   ·   Wikipedia   ·   Vercel Blob   ·   Neon</text>
  <text x="440" y="744" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#7a2314">reached ONLY from layer 2, and only by the ingest job</text>

  <!-- downward arrows -->
  <line x1="460" y1="176" x2="460" y2="200" stroke="#222222" stroke-width="3"/>
  <line x1="452" y1="192" x2="460" y2="204" stroke="#222222" stroke-width="3"/>
  <line x1="468" y1="192" x2="460" y2="204" stroke="#222222" stroke-width="3"/>

  <line x1="460" y1="292" x2="460" y2="316" stroke="#222222" stroke-width="3"/>
  <line x1="452" y1="308" x2="460" y2="320" stroke="#222222" stroke-width="3"/>
  <line x1="468" y1="308" x2="460" y2="320" stroke="#222222" stroke-width="3"/>

  <line x1="460" y1="422" x2="460" y2="576" stroke="#222222" stroke-width="3"/>
  <line x1="452" y1="568" x2="460" y2="580" stroke="#222222" stroke-width="3"/>
  <line x1="468" y1="568" x2="460" y2="580" stroke="#222222" stroke-width="3"/>
  <text x="470" y="500" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222222">resolvers read the DB through ctx.db</text>

  <line x1="260" y1="552" x2="260" y2="576" stroke="#222222" stroke-width="3"/>
  <line x1="252" y1="568" x2="260" y2="580" stroke="#222222" stroke-width="3"/>
  <line x1="268" y1="568" x2="260" y2="580" stroke="#222222" stroke-width="3"/>

  <line x1="260" y1="668" x2="260" y2="692" stroke="#222222" stroke-width="3"/>
  <line x1="252" y1="684" x2="260" y2="696" stroke="#222222" stroke-width="3"/>
  <line x1="268" y1="684" x2="260" y2="696" stroke="#222222" stroke-width="3"/>

  <!-- the forbidden arrow -->
  <line x1="880" y1="620" x2="880" y2="140" stroke="#cc2222" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="872" y1="152" x2="880" y2="136" stroke="#cc2222" stroke-width="3"/>
  <line x1="888" y1="152" x2="880" y2="136" stroke="#cc2222" stroke-width="3"/>
  <line x1="862" y1="360" x2="898" y2="396" stroke="#cc2222" stroke-width="5"/>
  <line x1="898" y1="360" x2="862" y2="396" stroke="#cc2222" stroke-width="5"/>
  <text x="910" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#cc2222">NEVER</text>
  <text x="910" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">No upward import.</text>
  <text x="910" y="402" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">A page importing</text>
  <text x="910" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">db/schema.ts, or</text>
  <text x="910" y="434" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">transform.ts calling</text>
  <text x="910" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">fetch, is the whole</text>
  <text x="910" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cc2222">structure collapsing.</text>

  <!-- side note: layered not hexagonal -->
  <rect x="900" y="90" width="280" height="230" fill="#fafafa" stroke="#999999" stroke-width="1" rx="6"/>
  <text x="914" y="114" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Layered, not hexagonal</text>
  <text x="914" y="138" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Hexagonal would put a port interface</text>
  <text x="914" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">in front of Postgres and OpenF1 so</text>
  <text x="914" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">either could be swapped.</text>
  <text x="914" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Neither is ever going to be. Postgres</text>
  <text x="914" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">constraints ARE the design; a port</text>
  <text x="914" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">generic enough to swap would have</text>
  <text x="914" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">to hide them.</text>
  <text x="914" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">So: honest layering, with the two</text>
  <text x="914" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">seams that pay for themselves —</text>
  <text x="914" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">the pure transform, and the resolver</text>
  <text x="914" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">context interface.</text>

  <!-- bottom note -->
  <rect x="60" y="790" width="1120" height="66" fill="#fffbe6" stroke="#ccaa00" stroke-width="1" rx="6"/>
  <text x="76" y="814" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Reading the DIP arrow correctly</text>
  <text x="76" y="836" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Layer 3 does not depend on Neon. It depends on { db, loaders, session } — an interface. In production that db is a neon-serverless Pool; in tests it is PGlite.</text>
  <text x="76" y="852" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Nothing in any resolver changes between the two. That substitutability is not theoretical here — it is the entire reason the test suite needs no Docker and no mocks.</text>
</svg>