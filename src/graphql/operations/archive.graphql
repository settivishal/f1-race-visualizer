# The archive pages: a driver's record, a team's, and the circuits.
#
# Career totals are summed from the season rows on the server so a page cannot
# render a total that disagrees with the rows beneath it.
query DriverProfile($code: String!) {
  driver(code: $code) {
    driver {
      id
      code
      name
      number
      country
    }
    career {
      seasonCount
      starts
      wins
      podiums
      points
      bestFinish
      seasons {
        season
        starts
        wins
        podiums
        points
        bestFinish
        team {
          name
          color
        }
      }
    }
  }
}

query TeamProfile($name: String!) {
  team(name: $name) {
    team {
      id
      name
      color
    }
    drivers {
      code
      name
    }
    career {
      seasonCount
      starts
      wins
      podiums
      points
      bestFinish
      seasons {
        season
        starts
        wins
        podiums
        points
        bestFinish
      }
    }
  }
}

# $all asks for careers, which only the all-seasons view shows.
query ArchiveIndex($season: Int, $all: Boolean!) {
  seasons {
    year
  }
  drivers(season: $season) {
    id
    code
    name
    number
    country
    latestTeam {
      name
      color
    }
    career @include(if: $all) {
      wins
      podiums
      points
      seasons {
        season
      }
    }
  }
  teams(season: $season) {
    id
    name
    color
    # The drivers page heads each garage with the team's years.
    career @include(if: $all) {
      seasons {
        season
      }
    }
  }
  circuits {
    id
    ergastId
    name
    locality
    country
    races {
      slug
      date
      status
      meeting {
        season
      }
      podium {
        position
        code
        teamColor
      }
    }
  }
}

query CircuitProfile($ergastId: String!) {
  circuit(ergastId: $ergastId) {
    id
    ergastId
    name
    locality
    country
    latitude
    longitude
    lengthKm
    turns
    firstGrandPrix
    races {
      slug
      date
      status
      meeting {
        season
        name
      }
      podium {
        position
        code
        teamColor
      }
    }
  }
}
