# The race library. `search` and `season` are resolver arguments rather than
# client-side filters: the database is better at filtering than the browser is,
# and a filtered result set the server produced is one the cache can hold.
query RaceLibrary($season: Int, $search: String, $first: Int, $after: String, $before: String) {
  # Grands prix only: a sprint is a session inside the weekend, and it arrives
  # on its grand prix as `weekendSprint` rather than as a second card.
  races(
    season: $season
    search: $search
    type: GRAND_PRIX
    first: $first
    after: $after
    before: $before
  ) {
    edges {
      cursor
      node {
        id
        slug
        date
        laps
        status
        type
        isFeatured
        meeting {
          name
          country
          circuitName
          round
          season
        }
        podium {
          position
          code
          teamColor
        }
        weekendSprint {
          slug
          status
          podium {
            position
            code
            teamColor
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
  seasons {
    year
  }
  # Which tile is "upcoming" and which one glows. Asked globally rather than
  # derived from the page's own edges, so both stay right on page two of "all
  # seasons" and on a past season, where neither should match anything.
  latestRace {
    slug
  }
  nextRace {
    slug
  }
}

# The race detail header. The replay payload itself arrives in a separate
# operation once the player lands, so this page renders without paying for
# every lap of every driver.
query RaceHeader($slug: String!) {
  race(slug: $slug) {
    id
    slug
    date
    laps
    status
    type
    meeting {
      name
      country
      circuitName
      round
      season
      circuit {
        ergastId
        name
        locality
        country
        lengthKm
        turns
        firstGrandPrix
      }
      # The weekend's other sessions, so a race page can point at its sibling —
      # the library shows one card per weekend, and without this the sprint is
      # reachable from the card and from nowhere else.
      races {
        slug
        type
        status
      }
    }
    results {
      finalPosition
      lapsCompleted
      points
      status
      fastestLap
      driver {
        code
        name
        number
      }
      team {
        name
        color
      }
    }
  }
}

# Slugs for generateStaticParams, and dates for the sitemap's <lastmod>. Two
# scalars per race, newest first, and no pagination — `races(first:)` is a keyset
# connection that clamps to 100 ascending, which prerendered the oldest hundred
# races and left the current season out of both the build and the sitemap.
query RaceSlugs {
  raceSlugs {
    slug
    date
  }
}
