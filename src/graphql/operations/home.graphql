# The lineup shown on the home page. Deliberately narrow: the page declares
# exactly what it needs, and codegen makes that a compile-time contract rather
# than a shape it hopes the resolver still returns.
query HomeLineup($season: Int!) {
  driverStandings(season: $season) {
    position
    points
    driver {
      code
      name
      number
    }
    team {
      name
      color
    }
  }
}

# Every race of a season, for the home page's progress bar and countdown.
# `first: 100` rather than the library's 24 — a season is at most 24 grands
# prix plus its sprints, and a page boundary here would under-count the season
# rather than showing a "next page" the caller could follow.
query SeasonSchedule($season: Int!) {
  races(season: $season, first: 100) {
    edges {
      node {
        slug
        date
        type
        status
        meeting {
          name
          round: officialRound
        }
      }
    }
  }
}

# The season the site is currently about, from app_config — the same value the
# ingest cron walks. See Query.activeSeason.
query ActiveSeason {
  activeSeason
}

# The hero's scrubbable chart. Deliberately narrow: lap and position only, and
# no gaps, lap times or sector columns — RaceReplay pulls all of those and is
# roughly ten times this over the wire. The teaser draws lines and nothing else.
query HeroReplay {
  featuredRace {
    slug
    laps
    meeting {
      name
      round: officialRound
      season
      circuitName
    }
    replay {
      summary {
        maxLap
        maxPosition
      }
      drivers {
        driver {
          code
        }
        team {
          color
        }
        positions {
          lap
          position
        }
      }
    }
  }
}

# The race just run: the podium, the fastest lap and the grid each driver
# started from, which is what makes the biggest mover computable.
query LatestResult {
  latestRace {
    slug
    date
    type
    meeting {
      name
      round: officialRound
      season
      circuitName
      country
    }
    results {
      finalPosition
      fastestLap
      points
      status
      driver {
        code
        name
      }
      team {
        name
        color
      }
    }
  }
}

# One entry per round, for the season strip.
query SeasonPulse($season: Int!) {
  seasonPulse(season: $season) {
    round
    name
    slug
    status
    winnerCode
    teamName
    teamColor
  }
}
